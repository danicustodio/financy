services:
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: file:/app/prisma/data.db
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    volumes:
      - db_data:/app/prisma

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000/graphql
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
